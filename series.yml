# series.yml —— 《巧做家庭菜600例》系列配置（skill：family-recipes-600）
#
# ★ 本件是**唯一的接口**：脚本只读本配置，⛔ 不内嵌任何册码／册名／路径。
# ★ 校验：python scripts/s0c_series_check.py --series series.yml
# ★ 相对路径一律以**本文件所在目录**为基准（本仓根＝知识库仓根）。
#
# ★★ 关于 source_root：值是**相对路径** `../../src-in`，指向**任务槽根**的 junction（目录联接）
#    → 扫描件父目录。★ 这个 junction 在**本仓树之外**：
#      · ⛔ 绝对路径不进本文件 —— `scripts/privacy_audit.py` 对全树扫「盘符」形态，命中即 FAIL；
#      · ⛔ 也不放在仓内 —— 实测：放进仓内时 `rglob` **会穿过** junction，
#        隐私复审把源卷上 19 个无关 PDF 当成本仓文件（见 OPEN-ITEMS.md G-05）。
#    ⇒ 放在槽根：仓内任何以仓根为起点的工具都够不到源卷。

series:
  id: "family-recipes-600"           # 进向量签名与仓名；kebab 文法
  title: "巧做家庭菜600例"            # ★ 取自印本封面（p0000 视觉实读），⛔ 不从文件名猜
  out_root: "."                      # 本仓库根**就是**知识库仓根 ⇒ 产物落 ./kb/册码/
  source_root: "../../src-in"         # ★ 相对路径 ⇒ 任务槽根的 junction → 扫描件父目录

  # 语言与转写
  language: "zh-Hans"
  page_index_base: 0                 # 源件第 1 页记为 p0000

  # 运行参数
  render_dpi: 300                    # ★ 见 books[0].note 的实测：原生仅约 96 dpi ⇒ 300 是上采样，S1 须先标定
  jobs: 4

  # 转写（S1）：视觉模型与它的密钥来源
  s1:
    model: "qwen3.8-omni-flash"
    env_var: "DASHSCOPE_API_KEY"

  # 册（★ 册码**登记即固化**：⛔ 任何脚本不得「当场排序得到」）
  books:
    - code: B01
      basename: "巧做家庭菜600例 (朴丰田口述； 穆里, 金岩整理) (Z-Library).pdf"
      title: "巧做家庭菜600例"
      title_source: "printed_cover"  # ★ 实读：p0000 封面（会话内视觉 · 200 dpi 渲染）
      pages: 289                     # ★ 实测（S0 逐页），⛔ 不是自称值
      note: "纯图 PDF：无文本层（首 20 页 0 字符）· 原生约 96 dpi（702×1043 px / 526.5×782.25 pt）· 单页单位图"

# ★ 水印净化：来源水印**记名时剥掉**，⛔ 不得进任何产物。
#   ★ 本册源件名里确实带 Z-Library 水印 —— 这是第一个真实带水印的实例。
#   ⚠ 已知缺口：迁入的引擎**尚未实现** clean_basename（见 OPEN-ITEMS.md G-03）。
watermark_strip:
  - "Z-Library"

# ── 装配契约：全部可配（技能与「某一套书」之间的接口）
# ★★ 本段**已按本册印刷体例标定**（2026-09-27 · P3 复验轮 9 · 用户裁定「写入这三条」）。
#    标定依据（全部实跑，见 `_TASK.md` 轮 9 与 `out/P3-REVALIDATION-REPORT.md`）：
#      · 编号形态：正文起点 569 里 括号中文 375（65.9%）＋ 阿拉伯 122（21%）⇒ `number_style: mixed`
#      · 编号口径：本册体例＝第X部分 → 章 → 章内从（一）重数（28 个章标题，27 个有食谱）⇒ `numbering: per_chapter`
#      · 章标题形态：`一、汤` … `十八、粗菜类`；★ **⛔ 不要**放宽到 `（N）` 形态 ——
#        该形态在本册**既是真子类标题**（`@@SECTION （一）干 贝`）**又是被漏标的食谱标题**（36 条），
#        行形态上不可区分，放宽后会制造假断号（实测章数 48、断号 20 章，⛔ 比不放宽更差）。
# ★ 标定后的实测读数：记录 **101 → 546** · 块 2643 → 3655 · 伪步骤 **0** · 目录 1246 行/12 页被排除 · 缺制法 无。
#
# ★★ 第四轮标定（2026-09-27 · 轮 11 · 引擎 0.1.4）—— 新增第四条：`subchapter_pattern`
#    背景：引擎 0.1.4 修掉 G-25/G-26/G-27 后，起点由 546 涨到 568（★ 22 条实害收回），
#    但**子类层级**（`（一）干 贝` 这类小标题）仍是撞号主因。三条候选**同机实测**：
#      A 不写该键        ⇒ 568 记录 · 27 作用域 · 撞号 **50 id / 144 条**
#      B 仅括号形态      ⇒ 568 记录 · 39 作用域 · 15 子类 · 撞号 **30 id / 61 条**
#      C **两种形态**（采用）⇒ 568 记录 · **40 作用域 · 16 子类** · 撞号 **21 id / 42 条**
#    ★ 三条**全部在 0.1.4 引擎下实跑**（A 用仓内探针配置 `series.probe-A.yml` 取「无该键」，
#      ⛔ 不是为了好看去引轮 10 的 0.1.3 读数 —— 那时是 48 id / 124 条，与 0.1.4 不可比）。
#    ⇒ 本册真书有 **16** 个子类标题：**15** 条是 `（N）` 形态、**1** 条是裸名（`酿菜类`，p0229）。
#    ★ 判据是**两个条件**且缺一不可：匹配本 pattern **且**下一非空行是 `@@RECIPE_START`
#      —— `（N）名字` 在本册既是真子类、又是被漏标的食谱标题（行形态不可区分）。
#    ⚠️ ⛔ **不要**给本 pattern 加末尾 `$` —— `$` 会框住整组，括号那一支只要后面还有菜名就失配
#      （实测：加 `$` 后子类 15 → 9、撞号 21 → 32，**更差**）。见技能 `references/已知坑.md` #49。
#
# ⚠ **仍然已知且不由本段负责**（⇒ 门 G2/G4 仍红，那是**正确的**读数）：
#    · G2 连续性：**13 个作用域缺号**（真漏标）＋ **1 处真错号**（C23 重 9 缺 8）
#      ⇒ 全部是**转写侧**（那几条食谱没有 `@@RECIPE_START` 行）；提示词经裁定**不改**。
#    · G4 id 唯一：剩余 **21 处撞号** ＝ **20**（C27，章标题 `十一、几种常用素菜制做方法`
#      **漏了 `@@SECTION` 前缀**，装配侧看不见）＋ **1**（C23 单点错号）。
#    · 1 条起点被**有意拒收**（p0015 `四拔汤（又名：…）` 无编号，G-27 裁定「不收但具名入账」）。
#    ⇒ ★ 本段已把**配置可修**的那部分全部消除；剩下的每一条都已**具名**。
#      见 `out/GAPS-2-RECEIPT.md`（技能侧）与 `out/P3-R11-REPORT.md`（本仓侧）。
contract:
  number_style: "mixed"                # arabic（出厂）| chinese | mixed
  numbering: "per_chapter"             # book_global（出厂）| per_chapter
  chapter_pattern: "^[一二三四五六七八九十]+、"
  subchapter_pattern: "^(?:（[一二三四五六七八九十]+）|[^\\s]{2,8}类)"   # ★ G-29：两种形态；还须下一非空行是 @@RECIPE_START
  markers:
    recipe_start: "@@RECIPE_START"
    recipe_cont: "@@RECIPE_CONT"
    section: "@@SECTION"
    step: "@@STEP"
    footer: "@@FOOTER"
    toc: "@@TOC"
  sections:
    ingredients: ["原 料", "原料", "材 料"]
    main: ["主 料", "主料"]
    side: ["配 料", "配料"]
    seasoning: ["调 料", "调料"]
    method: ["制 法", "制法", "制  法", "做 法"]
    notes: ["注 释", "注释"]
  groups:
    main: ["主 料：", "主料："]
    side: ["配 料：", "配料："]
    seasoning: ["调 料：", "调料："]
  step_number_patterns:
    - "^（\\d+）\\s*"
    - "^\\d+\\.\\s*"
    - "^\\(\\d+\\)\\s*"
  recipe_number_pattern: "^\\d{1,4}$"
  glossary_pattern: "^(?P<marker>[\\u2460-\\u2473\\u3251-\\u32BF])\\s*(?P<title>[^：]{1,20})：(?P<text>.+)$"

# 检索与模型（★ 模型名**必须进向量签名**）
retrieval:
  embed_provider: "siliconflow"
  embed_model: "Qwen/Qwen3-VL-Embedding-8B"
  rerank_model: "Qwen/Qwen3-Reranker-8B"
  rerank_default_on: true
  fallback: "keyword"                # 零网络零密钥灾备：关键词分层

# 密钥：⛔ 真钥不写在这里。读取阶梯＝环境变量 → 仓外 key 文件 → 仓内模板
keys:
  embed_provider: "siliconflow"
  env_var: "SILICONFLOW_API_KEY"
  key_file_candidates:
    - "~/.dsh/siliconflow.key"
    - "~/.config/family-recipes-600/siliconflow.key"
  template: "config/keys.example.json"

# 门禁
gates:
  cheap_first: true                  # 先跑便携／形态等廉价门
  verify_per_book: true              # 每册必须过 G 系列
  repo_check: true                   # 仓级 R 系列（R 系列是**仓级**，不属于技能本体）
